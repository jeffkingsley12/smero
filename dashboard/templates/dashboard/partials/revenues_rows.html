<tbody id="rows">
  {% for row in rows %}
    <tr><td>{{ row.source }}</td><td>{{ row.category.name }}</td><td>{{ row.academic_year.name }}</td><td class="numeric">{{ row.amount }} {{ row.currency }}</td></tr>
  {% empty %}
    <tr><td class="empty" colspan="4">No revenue recorded.</td></tr>
  {% endfor %}
</tbody>
